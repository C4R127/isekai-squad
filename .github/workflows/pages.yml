name: Publicar

# Publica el juego en GitHub Pages en cada cambio de main (o a mano desde la pestaña Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Probar y compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - name: Comprobar la dirección del servidor
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "::error::Falta la variable VITE_SERVER_URL. Créala en Settings → Secrets and variables → Actions → Variables con la dirección del servidor en Render (https://....onrender.com)."
            exit 1
          fi

      - name: Compilar el cliente
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: npm run build -w client

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist

  deploy:
    name: Publicar en Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
